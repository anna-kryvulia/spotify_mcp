[project]
name = "spotify-mcp-agents"
version = "0.1.0"
description = "Spotify Playlist Manager: two agents over a custom MCP server (GenAI mini-project)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9,<2",   # MCP SDK 1.x (FastMCP); у 2.x змінився API. [cli] дає `mcp dev`
    "openai>=1.40",       # клієнт для OpenRouter (OpenAI-сумісний API)
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[tool.uv]
# Це набір скриптів, а не бібліотека: uv лише керує середовищем і залежностями.
package = false
